name: Link Check
on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9 AM UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  link-check:
    name: Check for broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,204,301,302,401,402,403,429,503
            --exclude-path CODE_OF_CONDUCT.md
            --exclude "github.com/.*/stargazers"
            --exclude "linkedin.com"
            --exclude "x.com"
            --exclude "shoreline.io"
            --exclude "reddit.com"
            --exclude "devin.ai"
            --exclude "replit.com"
            --exclude "cursor.com"
            --exclude "kubezilla.io"
            --exclude "resourcely.io"
            --exclude "tryparity.com"
            --exclude "blameless.com"
            --max-retries 3
            --retry-wait-time 5
            --timeout 60
            "README.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
